
name: Terraform DEV CI

env:
  TF_VAR_aws_region: eu-north-1
  TF_VAR_environment: dev
  TF_VAR_enable_lifecycle: "false"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Static Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev/central-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../../

      - name: Terraform Init Without Backend
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact

      - name: Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  terraform-plan:
    name: Terraform DEV Plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: terraform-checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: environments/dev/central-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::057461015409:role/enterprise-data-platform-github-actions-dev
          aws-region: eu-north-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Plan - DEV
        run: terraform plan -input=false -no-color -lock-timeout=60s