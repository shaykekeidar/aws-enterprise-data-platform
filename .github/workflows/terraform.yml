
name: Terraform DEV CI
    
env: # because I don't copy tf configuration to git
      TF_VAR_aws_region: eu-north-1
      TF_VAR_environment: dev
      TF_VAR_enable_lifecycle: "false"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # with oicd ready

jobs:
  terraform-dev:
    name: Terraform DEV Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev/central-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../../

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Inspect OIDC Claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          echo "$PAYLOAD" | base64 -d 2>/dev/null | \
            jq '{iss, aud, sub, repository, repository_id, repository_owner_id}'
    
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::057461015409:role/enterprise-data-platform-github-actions-dev
          aws-region: eu-north-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity


      #- name: Terraform Plan - No AWS Credentials Test
      #  run: terraform plan -input=false -no-color -lock=false
