
name: Terraform PROD CI

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Select Terraform operation'
        required: true
        type: choice
        options:
          - plan
          - approve

      reviewed_commit:
        description: 'Git commit SHA reviewed in the PROD Plan (required for approve)'
        required: false
        type: string

env:
  # Terraform environment configuration
  TF_VAR_aws_region: eu-north-1
  TF_VAR_environment: prod
  TF_VAR_enable_lifecycle: "false"

permissions:
  contents: read
  id-token: write

jobs:

  # -----------------------------------------
  # PROD PLAN
  # -----------------------------------------

  terraform-prod-plan:
    name: Terraform PROD Plan
    if: ${{ inputs.operation == 'plan' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/prod/central-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../../

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::057461015409:role/enterprise-data-platform-github-actions-prod
          aws-region: eu-north-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --format compact

      - name: Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: '.'
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

      - name: Terraform Plan - PROD
        run: terraform plan -input=false -no-color -lock-timeout=60s

      - name: Display Plan Commit
        run: echo "PROD Plan generated for commit $GITHUB_SHA"

  # -----------------------------------------
  # MANUAL APPROVAL - SIMULATION ONLY
  # -----------------------------------------

  terraform-prod-approval:
    name: Terraform PROD Manual Approval
    if: ${{ inputs.operation == 'approve' }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate Approval Input
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          if [[ ! "$REVIEWED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Enter a valid 40-character Git commit SHA."
            exit 1
          fi

          if [[ "$REVIEWED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "ERROR: Reviewed commit differs from the selected workflow commit."
            exit 1
          fi

          echo "Reviewed commit: $REVIEWED_COMMIT"

      - name: Simulate Terraform Apply
        run: |
          echo "========================================="
          echo "PRODUCTION DEPLOYMENT - SIMULATION"
          echo "========================================="
          echo "Manual deployment confirmation received."
          echo "Approved commit: $GITHUB_SHA"
          echo "A real deployment would apply the reviewed Terraform plan."
          echo "No terraform apply command was executed."
          echo "No AWS resources were modified."
